name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Package .app
        run: ./scripts/build_app.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipShot-app
          path: dist/ClipShot.app
